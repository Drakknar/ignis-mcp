name: Build image

# Rebuild whenever nobbe/ignis:latest changes or the plugin changes.
on:
  schedule:
    - cron: "37 */6 * * *"
  workflow_dispatch:
    inputs:
      force:
        description: Rebuild even if nothing changed
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: false

env:
  UPSTREAM: docker.io/nobbe/ignis:latest
  IMAGE: ghcr.io/${{ github.repository_owner }}/ignis

jobs:
  # Builds and tests with read-only access. It runs upstream code, and on a
  # branch possibly a fix proposed by Claude, so it never holds a token that
  # can publish.
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    outputs:
      build: ${{ steps.check.outputs.build }}
      upstream_changed: ${{ steps.check.outputs.upstream_changed }}
      key: ${{ steps.check.outputs.key }}
      upstream: ${{ steps.check.outputs.upstream }}
      image: ${{ steps.check.outputs.image }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Decide whether to build
        id: check
        env:
          GHCR_CREDS: ${{ github.actor }}:${{ secrets.GITHUB_TOKEN }}
          PLUGIN_HASH: ${{ hashFiles('Dockerfile', 'plugin/**') }}
        run: |
          set -euo pipefail
          image="${IMAGE,,}"
          upstream=$(skopeo inspect --raw "docker://$UPSTREAM" | sha256sum | cut -d' ' -f1)
          upstream="sha256:$upstream"
          key="$upstream/$PLUGIN_HASH"
          current=$(skopeo inspect --creds "$GHCR_CREDS" "docker://$image:latest" 2>/dev/null \
            | jq -r '.Labels["net.stefanopignataro.build-key"] // ""' || true)
          echo "upstream=$upstream" >> "$GITHUB_OUTPUT"
          echo "key=$key" >> "$GITHUB_OUTPUT"
          echo "image=$image" >> "$GITHUB_OUTPUT"
          if [ "${current%%/*}" = "$upstream" ]; then
            echo "upstream_changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "upstream_changed=true" >> "$GITHUB_OUTPUT"
          fi
          if [ "$current" = "$key" ] && [ "${{ inputs.force }}" != "true" ]; then
            echo "Up to date ($key)"
            echo "build=false" >> "$GITHUB_OUTPUT"
          else
            echo "Building: '$current' -> '$key'"
            echo "build=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
        if: steps.check.outputs.build == 'true'

      - name: Build test image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        if: steps.check.outputs.build == 'true'
        with:
          context: .
          platforms: linux/amd64
          load: true
          tags: ignis-test
          build-args: |
            BASE_IMAGE=docker.io/nobbe/ignis@${{ steps.check.outputs.upstream }}

      # Exercises every MCP tool against a throwaway vault. If it fails,
      # nothing is published and the next scheduled run tries again.
      - name: Smoke test
        if: steps.check.outputs.build == 'true'
        run: bash scripts/smoke-test.sh ignis-test

  # The only job with write access. It runs no upstream or proposed code;
  # it rebuilds the tested image from the same digest and Dockerfile.
  publish:
    needs: build
    if: needs.build.outputs.build == 'true' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: ghcr # deployments allowed from main only
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          platforms: linux/amd64
          push: true
          build-args: |
            BASE_IMAGE=docker.io/nobbe/ignis@${{ needs.build.outputs.upstream }}
          tags: |
            ${{ needs.build.outputs.image }}:latest
            ${{ needs.build.outputs.image }}:${{ github.run_number }}
          labels: |
            net.stefanopignataro.build-key=${{ needs.build.outputs.key }}
            org.opencontainers.image.base.name=${{ env.UPSTREAM }}
            org.opencontainers.image.base.digest=${{ needs.build.outputs.upstream }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.licenses=AGPL-3.0-or-later

  # A scheduled or manual build on main that fails on a new upstream version
  # goes to Claude, which diagnoses it and proposes a fix as a pull request, or
  # opens an issue. Each failing build key is handled once (an outage is retried
  # after a day), and nothing new starts while an earlier fix pull request or
  # issue (label "upstream-fix") is open. A failure while
  # upstream is unchanged since the last publish comes from your own changes and
  # is left to you.
  triage:
    needs: build
    if: failure() && needs.build.outputs.build == 'true' && github.ref == 'refs/heads/main' && needs.build.outputs.upstream_changed == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: read
      pull-requests: read
    outputs:
      run: ${{ steps.gate.outputs.run }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Already handled?
        id: gate
        env:
          GH_TOKEN: ${{ github.token }}
          KEY: fix:${{ needs.build.outputs.key }}
        run: |
          set -euo pipefail
          if [ "$(bash .github/scripts/watch.sh has-open upstream-fix)" = true ]; then
            echo "::notice::An earlier upstream-fix pull request or issue is still open; not starting another."
            echo "run=false" >> "$GITHUB_OUTPUT"
          else
            echo "run=$(bash .github/scripts/watch.sh should-run "$KEY")" >> "$GITHUB_OUTPUT"
          fi

  fix:
    needs: [build, triage]
    if: always() && needs.triage.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
      actions: read
      packages: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Gather context
        env:
          GH_TOKEN: ${{ github.token }}
          GHCR_CREDS: ${{ github.actor }}:${{ secrets.GITHUB_TOKEN }}
          FAILING: ${{ needs.build.outputs.upstream }}
        run: |
          set -euo pipefail
          job=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/attempts/$GITHUB_RUN_ATTEMPT/jobs" \
            --jq '.jobs[] | select(.name == "build") | .id')
          gh api "repos/$GITHUB_REPOSITORY/actions/jobs/$job/logs" > "$RUNNER_TEMP/build.log" \
            || echo "(log unavailable)" > "$RUNNER_TEMP/build.log"
          image="${IMAGE,,}"
          last=$(skopeo inspect --creds "$GHCR_CREDS" "docker://$image:latest" 2>/dev/null || echo '{}')
          cat > "$RUNNER_TEMP/watch-context.md" <<CTX
          # Build failure
          - Run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID
          - Build log of the failed job: $RUNNER_TEMP/build.log
          - Upstream image: $UPSTREAM
            - Last good: $(jq -r '.Labels["org.opencontainers.image.base.digest"] // "unknown"' <<<"$last"), published as $image:latest on $(jq -r '.Created // "unknown"' <<<"$last")
            - Failing: $FAILING
          - Upstream source: https://github.com/Nystik-gh/ignis
          CTX

      # Claude reads untrusted upstream content, so the commands it runs are
      # kept away from the Claude token (tested 2026-10-11):
      # - the action's subprocess scrub (CLAUDE_CODE_SUBPROCESS_ENV_SCRUB below)
      #   removes it from their environment, and bubblewrap hides every other
      #   process from them (the action installs it only for workflows open to
      #   outside users, so it is installed here);
      # - no process can read another's memory (ptrace_scope 2), and sudo is
      #   gone for the rest of the job, so nothing can read the runner's memory.
      # Docker stays available because this job needs it to build and test, and
      # Docker access amounts to root, so here a determined attack could still
      # get around the isolation.
      # What remains visible to them is the job's read-only GitHub token.
      - name: Isolate Claude's commands
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends bubblewrap socat >/dev/null
          if [ -f /proc/sys/kernel/apparmor_restrict_unprivileged_userns ]; then
            sudo sysctl -qw kernel.apparmor_restrict_unprivileged_userns=0
          fi
          sudo sysctl -qw kernel.yama.ptrace_scope=2
          sudo rm -f /etc/sudoers.d/runner
          if sudo -n true 2>/dev/null; then
            echo "::error::sudo is still available"
            exit 1
          fi

      - name: Claude
        id: claude
        uses: anthropics/claude-code-action@16f9f71ab9c490faf367f94dd294897edc25be33 # v1.0.261
        env:
          CLAUDE_CODE_SUBPROCESS_ENV_SCRUB: "1"
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ github.token }}
          prompt: >-
            Follow the instructions in .github/prompts/upstream-fix.md.
            The facts for this run are in ${{ runner.temp }}/watch-context.md.
          claude_args: >-
            --model opus
            --max-turns 150
            --allowedTools "Bash,Read,Edit,Write,Glob,Grep,WebFetch,WebSearch,TodoWrite"
            --json-schema '{"type":"object","properties":{"status":{"type":"string","enum":["clear","fixed","needs_attention","transient"]},"title":{"type":"string"},"report":{"type":"string"},"improvements":{"type":"string"}},"required":["status","title","report","improvements"]}'

      # Runs after Claude in the same job, so it ignores what Claude's commands
      # could have planted: variables written to $GITHUB_ENV (the step's own env
      # wins), directories added to PATH (absolute shell, fixed PATH) and hooks,
      # config or filters in the workspace's .git (the diff is made in a fresh
      # clone). JavaScript actions can't be shielded the same way (a planted
      # NODE_OPTIONS wins over the step's), so after Claude only the artifact
      # upload is one; code planted there still can't reach the Claude token.
      # Only the verdict and the diff leave this job. The report job, which can
      # write, turns them into a pull request or issues.
      - name: Collect result
        if: always()
        shell: /bin/bash --noprofile --norc -eo pipefail {0}
        env:
          VERDICT: ${{ steps.claude.outputs.structured_output }}
          BASH_ENV: ""
          ENV: ""
        run: |
          export PATH=/usr/bin:/bin GIT_CONFIG_GLOBAL=/dev/null GIT_CONFIG_NOSYSTEM=1
          out="$RUNNER_TEMP/watch"
          clean="$RUNNER_TEMP/watch-clean"
          mkdir -p "$out"
          printf '%s' "$VERDICT" > "$out/verdict.json"
          git clone -q --no-checkout "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY.git" "$clean"
          git -C "$clean" -c advice.detachedHead=false checkout -q "$GITHUB_SHA"
          rsync -a --delete --exclude=/.git --exclude=/.github "$GITHUB_WORKSPACE/" "$clean/"
          # Claude's sandbox leaves empty placeholder files (.env, .npmrc,
          # package.json, lock files) where it blocks writes. A review never needs
          # to add an empty file, so new empty files are dropped.
          git -C "$clean" ls-files -z --others --exclude-standard |
            (cd "$clean" && xargs -0 -r -I{} find {} -maxdepth 0 -type f -empty -delete)
          git -C "$clean" add -A
          git -C "$clean" diff --cached --binary > "$out/changes.patch"
          git -C "$clean" diff --cached --stat

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: watch
          path: ${{ runner.temp }}/watch/
          retention-days: 1

  report:
    needs: [build, fix]
    if: always() && needs.fix.result != 'skipped'
    runs-on: ubuntu-latest
    timeout-minutes: 75 # includes waiting for the check on a proposed fix
    permissions:
      contents: write
      issues: write
      pull-requests: write
      actions: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ github.sha }}

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        continue-on-error: true
        with:
          name: watch
          path: ${{ runner.temp }}/watch

      # WATCH_SECRET only lets the script refuse to publish output that contains
      # the Claude token. No code from the review runs in this job.
      - name: Open pull request / issues
        env:
          GH_TOKEN: ${{ github.token }}
          WATCH_SECRET: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          WATCH_KEYS: fix:${{ needs.build.outputs.key }}=@
          WATCH_SUBJECT: ${{ env.UPSTREAM }} update
          WATCH_BRANCH: claude/fix-upstream-${{ github.run_number }}
          WATCH_DISPATCH: build.yml
          WATCH_MODE: fix
          WATCH_EXTRA_LABEL: upstream-fix
        run: bash .github/scripts/watch.sh report "$RUNNER_TEMP/watch"

      # Artifacts of public repositories can be downloaded by anyone signed in
      # to GitHub, so the review's raw output doesn't outlive this run.
      - name: Delete the review's files
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts" \
            --jq '.artifacts[] | select(.name == "watch") | .id' |
            while read -r id; do
              gh api -X DELETE "repos/$GITHUB_REPOSITORY/actions/artifacts/$id"
            done
